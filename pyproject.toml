[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcpush"
version = "0.1.0"
description = "Push a LeetCode solution to a GitHub repo in one interactive session, from any directory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Larry Wang" }]
keywords = ["leetcode", "github", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typer>=0.12",
  "questionary>=2.0",
  "prompt_toolkit>=3.0.38",
  "rapidfuzz>=3.6",
  "httpx>=0.27",
  "keyring>=25.0",
  "platformdirs>=4.2",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-timeout>=2.3"]

[project.urls]
Homepage = "https://github.com/larrywang/lcpush"

[project.scripts]
lcpush = "lcpush.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lcpush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 60

[tool.coverage.run]
source = ["lcpush"]
